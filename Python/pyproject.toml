[build-system]
requires = ["scikit-build-core", "pybind11>=2.10.0"]
build-backend = "scikit_build_core.build"

[project]
name = "multiRL"
version = "0.5.0"
description = "Python frontend for the multiRL C++ remake"
requires-python = ">=3.9"

[tool.scikit-build]
wheel.packages = ["multiRL"]
cmake.source-dir = "."

[tool.pyright]
extraPaths = ["."]
